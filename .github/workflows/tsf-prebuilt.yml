name: TSF prebuilt experiment

on:
  push:
    branches:
      - per-user-install
    paths:
      - '.github/workflows/tsf-prebuilt.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  tsf:
    runs-on: windows-2022
    timeout-minutes: 8

    steps:
      - name: Download prebuilt installer artifact
        uses: actions/download-artifact@v4
        with:
          repository: YiPrograms/weasel
          run-id: 37346844122
          name: weasel-artifact-0.17.4.0.50ecac0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prebuilt

      - name: Show prebuilt files
        shell: pwsh
        run: Get-ChildItem -Path prebuilt -Recurse | Select-Object FullName,Length

      - name: Set up MSVC for tiny TSF probe
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile ProfileMgr probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:TEMP 'weasel-profile-probe.cpp'
          $exe = Join-Path $env:TEMP 'weasel-profile-probe.exe'
          @'
          #include <windows.h>
          #include <msctf.h>
          #include <cstdio>
          #include <cwchar>

          static const GUID kWeaselClsid = {
              0xA3F4CDED, 0xB1E9, 0x41EE,
              {0x9C, 0xA6, 0x7B, 0x4D, 0x0D, 0xE6, 0xCB, 0x0A}};
          static const GUID kWeaselProfile = {
              0x3D02CAB6, 0x2B8E, 0x4781,
              {0xBA, 0x20, 0x1C, 0x92, 0x67, 0x52, 0x94, 0x67}};

          static void print_guid(const GUID& g) {
            std::printf(
                "{%08lX-%04hX-%04hX-%02hhX%02hhX-%02hhX%02hhX%02hhX%02hhX%02hhX%02hhX}",
                g.Data1, g.Data2, g.Data3,
                g.Data4[0], g.Data4[1], g.Data4[2], g.Data4[3],
                g.Data4[4], g.Data4[5], g.Data4[6], g.Data4[7]);
          }

          static HRESULT dump_profiles(ITfInputProcessorProfileMgr* mgr) {
            IEnumTfInputProcessorProfiles* e = nullptr;
            HRESULT hr = mgr->EnumProfiles(0x0404, &e);
            if (FAILED(hr)) {
              std::printf("EnumProfiles failed: 0x%08X\n",
                          static_cast<unsigned>(hr));
              return hr;
            }

            unsigned count = 0;
            TF_INPUTPROCESSORPROFILE item = {};
            ULONG fetched = 0;
            while (e->Next(1, &item, &fetched) == S_OK) {
              ++count;
              std::printf("Profile[%u] type=%lu langid=0x%04X clsid=",
                          count, item.dwProfileType, item.langid);
              print_guid(item.clsid);
              std::printf(" profile=");
              print_guid(item.guidProfile);
              std::printf(" flags=0x%08lX hkl=0x%p\n",
                          item.dwFlags, item.hkl);
            }
            std::printf("Profile count: %u\n", count);

            e->Release();
            return S_OK;
          }

          static void print_identity() {
            CHAR user[256] = {};
            DWORD user_len = ARRAYSIZE(user);
            if (GetUserNameA(user, &user_len))
              std::printf("User: %s\n", user);

            HANDLE token = nullptr;
            if (OpenProcessToken(GetCurrentProcess(), TOKEN_QUERY, &token)) {
              TOKEN_ELEVATION elevation = {};
              DWORD size = 0;
              if (GetTokenInformation(token, TokenElevation, &elevation,
                                      sizeof(elevation), &size)) {
                std::printf("Token elevated: %lu\n",
                            static_cast<unsigned long>(elevation.TokenIsElevated));
              }
              CloseHandle(token);
            }

            SID_IDENTIFIER_AUTHORITY nt_authority = SECURITY_NT_AUTHORITY;
            PSID admin_group = nullptr;
            BOOL is_admin = FALSE;
            if (AllocateAndInitializeSid(
                    &nt_authority, 2, SECURITY_BUILTIN_DOMAIN_RID,
                    DOMAIN_ALIAS_RID_ADMINS, 0, 0, 0, 0, 0, 0, &admin_group)) {
              CheckTokenMembership(nullptr, admin_group, &is_admin);
              FreeSid(admin_group);
            }
            std::printf("Admin token membership: %s\n", is_admin ? "yes" : "no");
          }

          static void print_registration_keys() {
            const WCHAR* tip_path =
                L"Software\\Microsoft\\CTF\\TIP\\{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}";
            const WCHAR* profile_path =
                L"Software\\Microsoft\\CTF\\TIP\\{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}\\LanguageProfile\\0x00000404\\{3D02CAB6-2B8E-4781-BA20-1C9267529467}";
            HKEY key = nullptr;
            LSTATUS status = RegOpenKeyExW(HKEY_CURRENT_USER, tip_path, 0,
                                           KEY_READ, &key);
            std::printf("HKCU TIP root status: %ld\n", static_cast<long>(status));
            if (status == ERROR_SUCCESS)
              RegCloseKey(key);

            key = nullptr;
            status = RegOpenKeyExW(HKEY_CURRENT_USER, profile_path, 0, KEY_READ, &key);
            std::printf("HKCU profile key status: %ld\n", static_cast<long>(status));
            if (status == ERROR_SUCCESS)
              RegCloseKey(key);

            key = nullptr;
            status = RegOpenKeyExW(HKEY_LOCAL_MACHINE, tip_path, 0,
                                   KEY_READ | KEY_WOW64_64KEY, &key);
            std::printf("HKLM TIP root status: %ld\n", static_cast<long>(status));
            if (status == ERROR_SUCCESS)
              RegCloseKey(key);

            key = nullptr;
            status = RegOpenKeyExW(HKEY_LOCAL_MACHINE, profile_path, 0,
                                   KEY_READ | KEY_WOW64_64KEY, &key);
            std::printf("HKLM profile key status: %ld\n", static_cast<long>(status));
            if (status == ERROR_SUCCESS)
              RegCloseKey(key);
          }

          static void print_user_install_state() {
            CHAR local_app_data[MAX_PATH] = {};
            DWORD env_len = GetEnvironmentVariableA(
                "LOCALAPPDATA", local_app_data, ARRAYSIZE(local_app_data));
            if (env_len > 0 && env_len < ARRAYSIZE(local_app_data))
              std::printf("LOCALAPPDATA: %s\n", local_app_data);

            HKEY key = nullptr;
            LSTATUS status = RegOpenKeyExA(HKEY_CURRENT_USER,
                                           "Software\\Rime\\Weasel", 0,
                                           KEY_READ, &key);
            std::printf("HKCU Software\\Rime\\Weasel status: %ld\n",
                        static_cast<long>(status));
            if (status != ERROR_SUCCESS)
              return;

            const char* value_names[] = {"WeaselRoot", "InstallDir"};
            for (const char* name : value_names) {
              CHAR value[MAX_PATH] = {};
              DWORD type = 0;
              DWORD size = sizeof(value);
              LSTATUS query = RegQueryValueExA(
                  key, name, nullptr, &type, reinterpret_cast<BYTE*>(value), &size);
              if (query == ERROR_SUCCESS)
                std::printf("HKCU %s: %s\n", name, value);
              else
                std::printf("HKCU %s query status: %ld\n", name,
                            static_cast<long>(query));
            }
            RegCloseKey(key);
          }

          static void probe_user_activation(ITfInputProcessorProfileMgr* mgr) {
            ITfInputProcessorProfiles* profiles = nullptr;
            HRESULT create_profiles = CoCreateInstance(
                CLSID_TF_InputProcessorProfiles, nullptr, CLSCTX_INPROC_SERVER,
                IID_ITfInputProcessorProfiles,
                reinterpret_cast<void**>(&profiles));
            std::printf("Activation ITfInputProcessorProfiles CoCreate HRESULT: 0x%08X\n",
                        static_cast<unsigned>(create_profiles));
            if (SUCCEEDED(create_profiles)) {
              HRESULT enable = profiles->EnableLanguageProfile(
                  kWeaselClsid, 0x0404, kWeaselProfile, TRUE);
              std::printf("EnableLanguageProfile HRESULT: 0x%08X\n",
                          static_cast<unsigned>(enable));
              HRESULT enable_default = profiles->EnableLanguageProfileByDefault(
                  kWeaselClsid, 0x0404, kWeaselProfile, TRUE);
              std::printf("EnableLanguageProfileByDefault HRESULT: 0x%08X\n",
                          static_cast<unsigned>(enable_default));
              profiles->Release();
            }

            std::puts("=== ProfileMgr after EnableLanguageProfile ===");
            dump_profiles(mgr);

            HMODULE input = LoadLibraryW(L"input.dll");
            std::printf("LoadLibrary(input.dll): %s\n", input ? "ok" : "failed");
            if (input) {
              using InstallLayoutOrTipFn = BOOL(WINAPI*)(LPCWSTR, DWORD);
              auto install_layout_or_tip = reinterpret_cast<InstallLayoutOrTipFn>(
                  GetProcAddress(input, "InstallLayoutOrTip"));
              std::printf("GetProcAddress(InstallLayoutOrTip): %s\n",
                          install_layout_or_tip ? "ok" : "failed");
              if (install_layout_or_tip) {
                const WCHAR tip[] =
                    L"0404:{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}{3D02CAB6-2B8E-4781-BA20-1C9267529467}";
                BOOL installed = install_layout_or_tip(tip, 0);
                std::printf("InstallLayoutOrTip result: %d last_error=%lu\n",
                            installed ? 1 : 0,
                            static_cast<unsigned long>(GetLastError()));
              }
              FreeLibrary(input);
            }

            std::puts("=== ProfileMgr after InstallLayoutOrTip ===");
            dump_profiles(mgr);
          }

          int wmain(int argc, wchar_t** argv) {
            HRESULT hr = CoInitializeEx(nullptr, COINIT_APARTMENTTHREADED);
            if (FAILED(hr))
              return 2;

            ITfInputProcessorProfileMgr* mgr = nullptr;
            hr = CoCreateInstance(CLSID_TF_InputProcessorProfiles, nullptr,
                                  CLSCTX_INPROC_SERVER,
                                  IID_ITfInputProcessorProfileMgr,
                                  reinterpret_cast<void**>(&mgr));
            if (FAILED(hr)) {
              std::printf("CoCreateInstance failed: 0x%08X\n",
                          static_cast<unsigned>(hr));
              CoUninitialize();
              return 3;
            }

            const bool register_mode =
                argc > 1 && std::wcscmp(argv[1], L"register") == 0;
            const bool inspect_mode =
                argc > 1 && std::wcscmp(argv[1], L"inspect") == 0;
            const bool activate_mode =
                argc > 1 && std::wcscmp(argv[1], L"activate") == 0;

            if (inspect_mode || activate_mode) {
              print_identity();
              std::puts("=== User install state ===");
              print_user_install_state();
              std::puts("=== Registration keys in current user ===");
              print_registration_keys();
              std::puts("=== ProfileMgr in current user ===");
            }

            if (activate_mode)
              probe_user_activation(mgr);

            if (register_mode) {
              print_identity();
              std::puts("=== Registration keys before TSF registration ===");
              print_registration_keys();

              ITfInputProcessorProfiles* profiles = nullptr;
              HRESULT register_create = CoCreateInstance(
                  CLSID_TF_InputProcessorProfiles, nullptr, CLSCTX_INPROC_SERVER,
                  IID_ITfInputProcessorProfiles,
                  reinterpret_cast<void**>(&profiles));
              std::printf("ITfInputProcessorProfiles CoCreate HRESULT: 0x%08X\n",
                          static_cast<unsigned>(register_create));
              if (SUCCEEDED(register_create)) {
                HRESULT register_service = profiles->Register(kWeaselClsid);
                std::printf("Register text service HRESULT: 0x%08X\n",
                            static_cast<unsigned>(register_service));
                profiles->Release();
              }

              std::puts("=== Registration keys after Register(text service) ===");
              print_registration_keys();

              WCHAR icon_file[MAX_PATH] = {};
              ULONG icon_len = GetModuleFileNameW(nullptr, icon_file,
                                                  ARRAYSIZE(icon_file));
              const WCHAR description[] = L"Weasel";
              hr = mgr->RegisterProfile(
                  kWeaselClsid, 0x0404, kWeaselProfile, description,
                  (ARRAYSIZE(description) - 1) * sizeof(wchar_t), icon_file,
                  icon_len, 0, nullptr, 0, TRUE, 0);
              std::printf("RegisterProfile HRESULT: 0x%08X\n",
                          static_cast<unsigned>(hr));

              std::puts("=== Registration keys after RegisterProfile ===");
              print_registration_keys();

              ITfCategoryMgr* category_mgr = nullptr;
              HRESULT category_create = CoCreateInstance(
                  CLSID_TF_CategoryMgr, nullptr, CLSCTX_INPROC_SERVER,
                  IID_ITfCategoryMgr, reinterpret_cast<void**>(&category_mgr));
              std::printf("ITfCategoryMgr CoCreate HRESULT: 0x%08X\n",
                          static_cast<unsigned>(category_create));
              if (SUCCEEDED(category_create)) {
                HRESULT register_category = category_mgr->RegisterCategory(
                    kWeaselClsid, GUID_TFCAT_CATEGORY_OF_TIP, kWeaselClsid);
                std::printf("RegisterCategory HRESULT: 0x%08X\n",
                            static_cast<unsigned>(register_category));
                category_mgr->Release();
              }

              std::puts("=== Registration keys after RegisterCategory ===");
              print_registration_keys();
              std::puts("=== ProfileMgr after RegisterProfile ===");
            }

            dump_profiles(mgr);
            mgr->Release();
            CoUninitialize();
            return 0;
          }
          '@ | Set-Content -Path $src -Encoding ascii

          & cl.exe /nologo /EHsc $src /link ole32.lib uuid.lib advapi32.lib /out:$exe
          if ($LASTEXITCODE -ne 0) {
            throw "Probe compile failed: $LASTEXITCODE"
          }

      - name: Probe TSF registration and real installer as a standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testUser = 'tsfprobe'
          $testPassword = ([Guid]::NewGuid().ToString('N') + 'aA1!')
          $securePassword = ConvertTo-SecureString $testPassword -AsPlainText -Force
          New-LocalUser -Name $testUser -Password $securePassword `
            -AccountNeverExpires -PasswordNeverExpires | Out-Null

          try {
            $probe = 'C:\Users\Public\weasel-profile-probe.exe'
            Copy-Item "$env:TEMP\weasel-profile-probe.exe" $probe -Force

            $credential = [PSCredential]::new("$env:COMPUTERNAME\$testUser", $securePassword)
            $stdout = Join-Path $env:RUNNER_TEMP 'tsf-register-standard-user.out'
            $stderr = Join-Path $env:RUNNER_TEMP 'tsf-register-standard-user.err'

            $p = Start-Process -FilePath $probe -ArgumentList 'register' `
              -Credential $credential -LoadUserProfile -Wait -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Write-Host "Standard-user probe exit code: $($p.ExitCode)"
            Write-Host '=== Standard-user RegisterProfile stdout ==='
            Get-Content $stdout
            if ((Test-Path $stderr) -and (Get-Item $stderr).Length -gt 0) {
              Write-Host '=== Standard-user RegisterProfile stderr ==='
              Get-Content $stderr
            }

            $profileRoot = "C:\Users\$testUser"
            $localAppData = Join-Path $profileRoot 'AppData\Local'
            $roamingAppData = Join-Path $profileRoot 'AppData\Roaming'
            $userTemp = Join-Path $localAppData 'Temp'
            New-Item -ItemType Directory -Path $userTemp -Force | Out-Null
            $childEnvironment = @{
              USERPROFILE = $profileRoot
              LOCALAPPDATA = $localAppData
              APPDATA = $roamingAppData
              TEMP = $userTemp
              TMP = $userTemp
              USERNAME = $testUser
              HOMEDRIVE = 'C:'
              HOMEPATH = "\Users\$testUser"
            }

            $seedLanguageOut = Join-Path $env:RUNNER_TEMP 'tsf-standard-user-seed-language.out'
            $seedLanguageErr = Join-Path $env:RUNNER_TEMP 'tsf-standard-user-seed-language.err'
            $seedLanguageCommand = @'
            $list = New-WinUserLanguageList 'zh-Hant-TW'
            Set-WinUserLanguageList $list -Force
            Get-WinUserLanguageList | ForEach-Object { $_.InputMethodTips }
            '@
            $encodedSeedLanguageCommand = [Convert]::ToBase64String(
              [Text.Encoding]::Unicode.GetBytes($seedLanguageCommand))
            $seedLanguageProcess = Start-Process -FilePath 'powershell.exe' `
              -ArgumentList @('-NoProfile','-NonInteractive','-EncodedCommand',$encodedSeedLanguageCommand) `
              -Credential $credential -LoadUserProfile -Environment $childEnvironment -Wait -PassThru `
              -RedirectStandardOutput $seedLanguageOut -RedirectStandardError $seedLanguageErr
            Write-Host "Seed zh-Hant-TW exit code: $($seedLanguageProcess.ExitCode)"
            Write-Host '=== Standard-user language list before Weasel install ==='
            Get-Content $seedLanguageOut
            if ((Test-Path $seedLanguageErr) -and (Get-Item $seedLanguageErr).Length -gt 0) {
              Write-Host '=== Standard-user seed-language stderr ==='
              Get-Content $seedLanguageErr
            }

            $installerSource = Get-ChildItem -Path prebuilt -Recurse -Filter '*-user-installer.exe' |
              Select-Object -First 1
            if (-not $installerSource) {
              throw 'Per-user installer not found in prebuilt artifact.'
            }
            $installer = 'C:\Users\Public\weasel-user-installer.exe'
            Copy-Item $installerSource.FullName $installer -Force

            Write-Host '=== Run real per-user installer as standard user ==='
            $installProcess = Start-Process -FilePath $installer -ArgumentList @('/S','/T') `
              -Credential $credential -LoadUserProfile -Environment $childEnvironment -PassThru
            if (-not $installProcess.WaitForExit(90000)) {
              Stop-Process -Id $installProcess.Id -Force -ErrorAction SilentlyContinue
              throw 'Standard-user per-user installer timed out.'
            }
            Write-Host "Standard-user installer exit code: $($installProcess.ExitCode)"

            $inspectOut = Join-Path $env:RUNNER_TEMP 'tsf-standard-user-after-install.out'
            $inspectErr = Join-Path $env:RUNNER_TEMP 'tsf-standard-user-after-install.err'
            $inspectProcess = Start-Process -FilePath $probe -ArgumentList 'inspect' `
              -Credential $credential -LoadUserProfile -Environment $childEnvironment -Wait -PassThru `
              -RedirectStandardOutput $inspectOut -RedirectStandardError $inspectErr
            Write-Host "Standard-user inspect exit code: $($inspectProcess.ExitCode)"
            Write-Host '=== Standard-user state after real per-user install ==='
            Get-Content $inspectOut
            if ((Test-Path $inspectErr) -and (Get-Item $inspectErr).Length -gt 0) {
              Write-Host '=== Standard-user inspect stderr ==='
              Get-Content $inspectErr
            }

            $activateOut = Join-Path $env:RUNNER_TEMP 'tsf-standard-user-activation.out'
            $activateErr = Join-Path $env:RUNNER_TEMP 'tsf-standard-user-activation.err'
            $activateProcess = Start-Process -FilePath $probe -ArgumentList 'activate' `
              -Credential $credential -LoadUserProfile -Environment $childEnvironment -Wait -PassThru `
              -RedirectStandardOutput $activateOut -RedirectStandardError $activateErr
            Write-Host "Standard-user activation probe exit code: $($activateProcess.ExitCode)"
            Write-Host '=== Standard-user activation APIs after per-user install ==='
            Get-Content $activateOut
            if ((Test-Path $activateErr) -and (Get-Item $activateErr).Length -gt 0) {
              Write-Host '=== Standard-user activation stderr ==='
              Get-Content $activateErr
            }

            $languageOut = Join-Path $env:RUNNER_TEMP 'tsf-standard-user-language-list.out'
            $languageErr = Join-Path $env:RUNNER_TEMP 'tsf-standard-user-language-list.err'
            $languageCommand = 'Get-WinUserLanguageList | ForEach-Object { $_.InputMethodTips }'
            $encodedLanguageCommand = [Convert]::ToBase64String(
              [Text.Encoding]::Unicode.GetBytes($languageCommand))
            $languageProcess = Start-Process -FilePath 'powershell.exe' `
              -ArgumentList @('-NoProfile','-NonInteractive','-EncodedCommand',$encodedLanguageCommand) `
              -Credential $credential -LoadUserProfile -Environment $childEnvironment -Wait -PassThru `
              -RedirectStandardOutput $languageOut -RedirectStandardError $languageErr
            Write-Host '=== Standard-user Get-WinUserLanguageList after activation APIs ==='
            Get-Content $languageOut
            if ((Test-Path $languageErr) -and (Get-Item $languageErr).Length -gt 0) {
              Write-Host '=== Standard-user language-list stderr ==='
              Get-Content $languageErr
            }
          }
          finally {
            Remove-LocalUser -Name $testUser -ErrorAction SilentlyContinue
          }

      - name: Install prebuilt per-user package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path prebuilt -Recurse -Filter '*-user-installer.exe' |
            Select-Object -First 1
          if (-not $installer) {
            throw 'Per-user installer not found in prebuilt artifact.'
          }
          Write-Host "Installer: $($installer.FullName)"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList @('/S','/T') -PassThru
          if (-not $p.WaitForExit(90000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Per-user installer timed out.'
          }
          Write-Host "Per-user installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            throw "Per-user installer failed: $($p.ExitCode)"
          }

      - name: Inspect per-user TSF state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== Get-WinUserLanguageList ==='
          powershell.exe -NoProfile -Command 'Get-WinUserLanguageList | ForEach-Object { $_.InputMethodTips }'

          Write-Host '=== HKCU TIP 64-bit view ==='
          & reg.exe query 'HKCU\Software\Microsoft\CTF\TIP\{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}' /s /reg:64
          Write-Host '=== HKCU TIP 32-bit view ==='
          & reg.exe query 'HKCU\Software\Microsoft\CTF\TIP\{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}' /s /reg:32

          Write-Host '=== ProfileMgr before machine install ==='
          & "$env:TEMP\weasel-profile-probe.exe"
          $global:LASTEXITCODE = 0

          Write-Host '=== Add RegisterProfile metadata to HKCU ==='
          $profileKey = 'HKCU:\Software\Microsoft\CTF\TIP\{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}\LanguageProfile\0x00000404\{3D02CAB6-2B8E-4781-BA20-1C9267529467}'
          New-ItemProperty -Path $profileKey -Name 'HiddenInSettingUI' -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $profileKey -Name 'SubItemInSettingUI' -PropertyType DWord -Value 0 -Force | Out-Null

          Write-Host '=== ProfileMgr after HKCU metadata patch ==='
          & "$env:TEMP\weasel-profile-probe.exe"
          $global:LASTEXITCODE = 0


      - name: Patch HKCU profile metadata to match machine registration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'HKCU:\Software\Microsoft\CTF\TIP\{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}\LanguageProfile'
          Get-ChildItem $base | ForEach-Object {
            Get-ChildItem $_.PSPath | ForEach-Object {
              New-ItemProperty -Path $_.PSPath -Name HiddenInSettingUI -PropertyType DWord -Value 0 -Force | Out-Null
              New-ItemProperty -Path $_.PSPath -Name SubItemInSettingUI -PropertyType DWord -Value 0 -Force | Out-Null
            }
          }

          Write-Host '=== ProfileMgr after adding HiddenInSettingUI/SubItemInSettingUI ==='
          & "$env:TEMP\weasel-profile-probe.exe"
          $global:LASTEXITCODE = 0

      - name: Full machine-install control using prebuilt files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-ItemProperty 'HKCU:\Software\Rime\Weasel').WeaselRoot
          $setup = Join-Path $root 'WeaselSetup.exe'
          if (-not (Test-Path $setup)) {
            throw "WeaselSetup.exe not found under $root"
          }
          Write-Host "Machine control setup: $setup"
          $p = Start-Process -FilePath $setup -ArgumentList @('/t') -PassThru
          if (-not $p.WaitForExit(90000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Machine WeaselSetup /t timed out.'
          }
          Write-Host "Machine WeaselSetup exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            throw "Machine WeaselSetup failed: $($p.ExitCode)"
          }

      - name: Inspect machine TSF state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== HKLM TIP 64-bit view ==='
          & reg.exe query 'HKLM\SOFTWARE\Microsoft\CTF\TIP\{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}' /s /reg:64
          Write-Host '=== HKLM TIP 32-bit view ==='
          & reg.exe query 'HKLM\SOFTWARE\Microsoft\CTF\TIP\{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}' /s /reg:32

          Write-Host '=== ProfileMgr after full machine install ==='
          & "$env:TEMP\weasel-profile-probe.exe"

          Write-Host '=== HKCU TIP after machine install ==='
          $userTip = 'HKCU:\Software\Microsoft\CTF\TIP\{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}'
          if (Test-Path $userTip) {
