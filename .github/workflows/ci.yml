name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - '[0-9]+.*'
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4

      - name: Install clang-format 18
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          wget https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo gpg --dearmor < llvm-snapshot.gpg.key > /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-18.list
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          clang-format --version

      - name: Code style lint
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: ./clang-format.sh -i

  build:
    needs: lint
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
      SDKVER: 10.0.19041.0
    strategy:
      fail-fast: false
      matrix:
        variant: [msbuild, xmake]
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Configure build environment
        shell: bash
        run: |
          cp env.vs2022.bat env.bat
          echo git_ref_name="$(git describe --always)" >> $GITHUB_ENV

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./install_boost.bat
          ./build.bat boost arm64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: ${{ env.SDKVER }}

      # bundled winsparkle v0.9.2 to disable auto open ReleaseNoteUrl in default browser
      - name: cache bundled winsparkle
        id: cache-winsparkle
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\winsparkle\x64\Release\WinSparkle.dll
            ${{ github.workspace }}\winsparkle\x64\Release\WinSparkle.lib
            ${{ github.workspace }}\winsparkle\Release\WinSparkle.dll
            ${{ github.workspace }}\winsparkle\Release\WinSparkle.lib
          key: ${{ runner.os }}-winsparkle-v0.9.2-bundled
          restore-keys: |
            winsparkle-v0.9.2-bundled

      - name: Build bundled winsparkle
        if: steps.cache-winsparkle.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path winsparkle) { Remove-Item -Recurse -Force winsparkle }
          # Clone winsparkle repo v0.9.2
          git clone https://github.com/vslavik/winsparkle.git -b v0.9.2 --depth 1
          cd winsparkle
          git submodule update --init --recursive
          copy ..\bundled_winsparkle.patch .
          git apply bundled_winsparkle.patch
          nuget restore
          msbuild -m -t:Build -p:Configuration=Release -p:Platform=x64 WinSparkle.sln
          msbuild -m -t:Build -p:Configuration=Release -p:Platform=Win32 WinSparkle.sln

      - name: Install WinSparkle files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          copy .\winsparkle\x64\Release\WinSparkle.dll .\output\
          copy .\winsparkle\x64\Release\WinSparkle.lib .\lib64\
          copy .\winsparkle\Release\WinSparkle.dll .\output\Win32\
          copy .\winsparkle\Release\WinSparkle.lib .\lib\

      - name: Get Rime files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-rime.ps1 -use dev

      - name: Build data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat data

      - name: Setup xmake
        if: matrix.variant == 'xmake'
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Build Weasel
        shell: pwsh
        id: build_weasel
        env:
          RELEASE_BUILD: ${{ (github.repository == 'rime/weasel' && startsWith(github.ref, 'refs/tags/')) && '1' || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.variant }}' -eq 'msbuild') {
            .\build.bat arm64 installer
          } else {
            .\xbuild.bat arm64 installer
          }

      - name: Unsigned per-user TSF comparison
        if: matrix.variant == 'msbuild' && !startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tipPath = 'HKCU:\Software\Microsoft\CTF\TIP\{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}'
          $userProfilePath = 'HKCU:\Control Panel\International\User Profile\zh-Hant-TW'
          $tipName = '0404:{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}{3D02CAB6-2B8E-4781-BA20-1C9267529467}'

          Write-Host 'phase=unsigned-seed-language-profile'
          $userProfileRoot = 'HKCU:\Control Panel\International\User Profile'
          New-Item -Path $userProfileRoot -Force | Out-Null
          New-ItemProperty `
            -Path $userProfileRoot `
            -Name 'Languages' `
            -PropertyType MultiString `
            -Value @('zh-Hant-TW') `
            -Force | Out-Null

          Write-Host 'phase=unsigned-check-signatures'
          foreach ($dll in @('.\output\weasel.dll', '.\output\weaselx64.dll')) {
            $signature = Get-AuthenticodeSignature $dll
            Write-Host "Unsigned baseline signature ${dll}: $($signature.Status)"
            if ($signature.Status -eq 'Valid') {
              throw "Unsigned baseline is unexpectedly signed: $dll"
            }
          }

          Write-Host 'phase=unsigned-clear-stale-registration'
          Remove-Item $tipPath -Recurse -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty `
            -Path $userProfilePath `
            -Name $tipName `
            -ErrorAction SilentlyContinue

          Write-Host 'phase=unsigned-run-weasel-setup'
          $setup = Start-Process `
            -FilePath '.\output\WeaselSetup.exe' `
            -ArgumentList @('/t', '/user') `
            -PassThru
          if (-not $setup.WaitForExit(90000)) {
            Stop-Process -Id $setup.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path "$env:TEMP\weasel-register.log") {
              Get-Content "$env:TEMP\weasel-register.log"
            }
            throw 'Unsigned WeaselSetup /t /user timed out.'
          }
          if ($setup.ExitCode -ne 0) {
            if (Test-Path "$env:TEMP\weasel-register.log") {
              Get-Content "$env:TEMP\weasel-register.log"
            }
            throw "Unsigned WeaselSetup /t /user failed with exit code $($setup.ExitCode)"
          }

          $tipImmediatelyPresent = Test-Path $tipPath
          $profile = Get-ItemProperty -Path $userProfilePath -ErrorAction SilentlyContinue
          $profileImmediatelyPresent = $null -ne $profile -and $null -ne $profile.$tipName
          Write-Host "Unsigned TIP immediately after setup: $tipImmediatelyPresent"
          Write-Host "Unsigned User Profile immediately after setup: $profileImmediatelyPresent"

          Write-Host 'phase=unsigned-language-list-probe'
          $probeOut = Join-Path $env:TEMP 'weasel-unsigned-language-list.txt'
          $probeErr = Join-Path $env:TEMP 'weasel-unsigned-language-list.err.txt'
          Remove-Item $probeOut, $probeErr -Force -ErrorAction SilentlyContinue
          $probeCommand = 'Get-WinUserLanguageList | Format-List *'
          $encodedProbe = [Convert]::ToBase64String(
            [Text.Encoding]::Unicode.GetBytes($probeCommand)
          )
          $probe = Start-Process `
            -FilePath 'powershell.exe' `
            -ArgumentList @('-NoProfile', '-NonInteractive', '-EncodedCommand', $encodedProbe) `
            -RedirectStandardOutput $probeOut `
            -RedirectStandardError $probeErr `
            -PassThru
          if (-not $probe.WaitForExit(20000)) {
            Write-Warning 'Unsigned Get-WinUserLanguageList timed out on the hosted runner.'
            Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue
          } elseif ($probe.ExitCode -ne 0) {
            Write-Warning "Unsigned Get-WinUserLanguageList exited with $($probe.ExitCode)."
          }

          $probeText = ''
          if (Test-Path $probeOut) {
            $probeText = Get-Content $probeOut -Raw
            Write-Host 'Unsigned WinUserLanguageList output:'
            Write-Host $probeText
          }
          if (Test-Path $probeErr) {
            Get-Content $probeErr
          }

          $unsignedListed = $probeText -like "*$tipName*"
          $tipStillPresent = Test-Path $tipPath
          $profileAfter = Get-ItemProperty -Path $userProfilePath -ErrorAction SilentlyContinue
          $userProfileStillPresent = $null -ne $profileAfter -and $null -ne $profileAfter.$tipName
          Write-Host "Unsigned language list contains Weasel: $unsignedListed"
          Write-Host "Unsigned TIP after language-list probe: $tipStillPresent"
          Write-Host "Unsigned User Profile after language-list probe: $userProfileStillPresent"

          if (Test-Path "$env:TEMP\weasel-register.log") {
            Write-Host 'Unsigned registration trace:'
            Get-Content "$env:TEMP\weasel-register.log"
          }

      - name: Signed per-user TSF smoke test
        if: matrix.variant == 'msbuild' && !startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'phase=seed-language-profile'
          $userProfileRoot = 'HKCU:\Control Panel\International\User Profile'
          New-Item -Path $userProfileRoot -Force | Out-Null
          New-ItemProperty `
            -Path $userProfileRoot `
            -Name 'Languages' `
            -PropertyType MultiString `
            -Value @('zh-Hant-TW') `
            -Force | Out-Null

          Write-Host 'phase=create-test-certificate-dotnet'
          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          $subject = [System.Security.Cryptography.X509Certificates.X500DistinguishedName]::new(
            'CN=Weasel CI Test IME'
          )
          $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
            $subject,
            $rsa,
            [System.Security.Cryptography.HashAlgorithmName]::SHA256,
            [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
          )
          $eku = [System.Security.Cryptography.OidCollection]::new()
          [void]$eku.Add([System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3'))
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new(
              $eku, $false
            )
          )
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
              [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature,
              $true
            )
          )

          $cert = $request.CreateSelfSigned(
            [DateTimeOffset]::UtcNow.AddMinutes(-5),
            [DateTimeOffset]::UtcNow.AddHours(2)
          )
          $pfxPassword = 'weasel-ci-test'
          $pfxPath = Join-Path $env:TEMP 'weasel-ci-test.pfx'
          [IO.File]::WriteAllBytes(
            $pfxPath,
            $cert.Export(
              [System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx,
              $pfxPassword
            )
          )

          Write-Host 'phase=trust-test-certificate'
          $publicCert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          )
          foreach ($storeName in @('Root', 'TrustedPublisher')) {
            Write-Host "phase=trust-$storeName-open"
            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new(
              $storeName,
              [System.Security.Cryptography.X509Certificates.StoreLocation]::LocalMachine
            )
            $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)

            Write-Host "phase=trust-$storeName-add"
            $store.Add($publicCert)

            Write-Host "phase=trust-$storeName-close"
            $store.Close()
          }
          Write-Host 'phase=trust-test-certificate-done'

          Write-Host 'phase=sign-tsf-dlls'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName |
            Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw 'signtool.exe was not found.'
          }
          Write-Host "signtool=$signtool"

          foreach ($dll in @('.\output\weasel.dll', '.\output\weaselx64.dll')) {
            & $signtool sign /fd SHA256 /f $pfxPath /p $pfxPassword $dll
            if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed for ${dll}: $LASTEXITCODE"
            }
            & $signtool verify /pa /v $dll
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verify failed for ${dll}: $LASTEXITCODE"
            }
          }

          Write-Host 'phase=clear-stale-registration'
          Remove-Item 'HKCU:\Software\Microsoft\CTF\TIP\{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}' `
            -Recurse -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty `
            -Path 'HKCU:\Control Panel\International\User Profile\zh-Hant-TW' `
            -Name '0404:{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}{3D02CAB6-2B8E-4781-BA20-1C9267529467}' `
            -ErrorAction SilentlyContinue

          Write-Host 'phase=run-weasel-setup'
          $setup = Start-Process `
            -FilePath '.\output\WeaselSetup.exe' `
            -ArgumentList @('/t', '/user') `
            -PassThru
          if (-not $setup.WaitForExit(90000)) {
            Stop-Process -Id $setup.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path "$env:TEMP\weasel-register.log") {
              Get-Content "$env:TEMP\weasel-register.log"
            }
            throw 'WeaselSetup /t /user timed out.'
          }
          if ($setup.ExitCode -ne 0) {
            if (Test-Path "$env:TEMP\weasel-register.log") {
              Get-Content "$env:TEMP\weasel-register.log"
            }
            throw "WeaselSetup /t /user failed with exit code $($setup.ExitCode)"
          }

          $tipPath = 'HKCU:\Software\Microsoft\CTF\TIP\{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}'
          $userProfilePath = 'HKCU:\Control Panel\International\User Profile\zh-Hant-TW'
          $tipName = '0404:{A3F4CDED-B1E9-41EE-9CA6-7B4D0DE6CB0A}{3D02CAB6-2B8E-4781-BA20-1C9267529467}'

          if (-not (Test-Path $tipPath)) {
            throw 'Per-user CTF TIP registration was not created.'
          }
          $profile = Get-ItemProperty -Path $userProfilePath -ErrorAction Stop
          if ($null -eq $profile.$tipName) {
            throw 'Weasel was not added to the current-user language profile.'
          }
          Write-Host "User Profile immediately after setup: $($profile.$tipName)"

          Write-Host 'phase=language-list-probe'
          $probeOut = Join-Path $env:TEMP 'weasel-language-list.txt'
          $probeErr = Join-Path $env:TEMP 'weasel-language-list.err.txt'
          $probeCommand = @"
          Get-WinUserLanguageList | Format-List *
          "@
          $encodedProbe = [Convert]::ToBase64String(
            [Text.Encoding]::Unicode.GetBytes($probeCommand)
          )
          $probe = Start-Process `
            -FilePath 'powershell.exe' `
            -ArgumentList @('-NoProfile', '-NonInteractive', '-EncodedCommand', $encodedProbe) `
            -RedirectStandardOutput $probeOut `
            -RedirectStandardError $probeErr `
            -PassThru
          if (-not $probe.WaitForExit(20000)) {
            Write-Warning 'Get-WinUserLanguageList timed out on the hosted runner.'
            Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue
          } elseif ($probe.ExitCode -ne 0) {
            Write-Warning "Get-WinUserLanguageList exited with $($probe.ExitCode)."
          }
          if (Test-Path $probeOut) {
            Get-Content $probeOut
          }
          if (Test-Path $probeErr) {
            Get-Content $probeErr
          }

          Write-Host 'phase=post-probe-registry-check'
          $tipStillPresent = Test-Path $tipPath
          $profileAfter = Get-ItemProperty -Path $userProfilePath -ErrorAction Stop
          $userProfileStillPresent = $null -ne $profileAfter.$tipName
          Write-Host "TIP after language-list probe: $tipStillPresent"
          Write-Host "User Profile entry after language-list probe: $userProfileStillPresent"

          if (Test-Path "$env:TEMP\weasel-register.log") {
            Write-Host 'Registration trace:'
            Get-Content "$env:TEMP\weasel-register.log"
          }

          if (-not $tipStillPresent -or -not $userProfileStillPresent) {
            throw 'Signed per-user TSF registration did not survive the language-list probe.'
          }

      - name: Compress Debug Symbols
        if: matrix.variant == 'msbuild'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          output\7z.exe a -t7z "./output/archives/debug_symbols.7z" "output/*.pdb" -r

      - name: Upload artifacts
        if: matrix.variant == 'msbuild'
        uses: actions/upload-artifact@v4
        with:
          name: weasel-artifact-${{ env.git_ref_name }}
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe
            .\output\archives\debug_symbols.7z

      # Release-only steps (run on tags or master)
      - name: Extract changelog
        if: ${{ github.repository == 'rime/weasel' && startsWith(github.ref, 'refs/tags/') && matrix.variant == 'msbuild' }}
        shell: pwsh
        run: .\extract_changelog.ps1

      - name: Create Nightly release
        if: ${{ github.repository == 'rime/weasel' && github.ref == 'refs/heads/master' && matrix.variant == 'msbuild' }}
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: "Nightly Build"
          files: |
            ./output/archives/weasel*.exe
            ./output/archives/debug_symbols.7z

      - name: Release (stable)
        if: ${{ github.repository == 'rime/weasel' && startsWith(github.ref, 'refs/tags/') && matrix.variant == 'msbuild' }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ./output/archives/weasel*.exe
            ./output/archives/debug_symbols.7z
          body_path: ${{ github.workspace }}/RELEASE_CHANGELOG.md
